name: Deploy ATW Backend DEV

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev

    concurrency:
      group: atw-backend-dev
      cancel-in-progress: false

    env:
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build application JAR
        uses: ./.github/actions/backend-tasks
        with:
          operation: build-jar

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        uses: ./.github/actions/backend-tasks
        with:
          operation: acr-login
          acr_name: ${{ vars.ACR_NAME }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/atw-backend:${{ env.IMAGE_TAG }}

      - name: Configure settings and deploy
        uses: ./.github/actions/backend-tasks
        with:
          operation: deploy
          app_name: ${{ vars.BACKEND_APP_NAME }}
          resource_group: ${{ vars.AZURE_RESOURCE_GROUP }}
          image: ${{ vars.ACR_LOGIN_SERVER }}/atw-backend:${{ env.IMAGE_TAG }}
          key_vault_name: ${{ vars.KEY_VAULT_NAME }}
          runtime_identity_resource_id: ${{ vars.RUNTIME_IDENTITY_RESOURCE_ID }}
          app_config_endpoint: ${{ vars.APP_CONFIG_ENDPOINT }}
