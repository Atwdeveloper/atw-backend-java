name: Trigger auto deployment for atw-backend-app

on:
  push:
    branches:
      [ main ]
    paths:
    - '**'
    - '.github/workflows/atw-backend-app-AutoDeployTrigger-6ca61134-6363-485d-a102-a56b6f15b55e.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ATWBACKENDAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ATWBACKENDAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ATWBACKENDAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ca24a2b99736acr

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: ca24a2b99736acr.azurecr.io
          containerAppName: atw-backend-app
          resourceGroup: anytimework-rg
          imageToBuild: ca24a2b99736acr.azurecr.io/atw-backend-app:${{ github.sha }}
          targetPort: 8080
