spring.application.name=atw-backend

# ---- Active profile ----
# "local" = this file's insecure dev conveniences (application-local.properties) are layered in.
# Any other value (e.g. "prod") keeps this file's safe-by-default settings and is enforced by
# StartupSecurityValidator (refuses to boot with a missing/default secret or bootstrap password).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ---- Datasource (PostgreSQL) ----
# Override via environment variables in each environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/atw}
spring.datasource.username=${DB_USERNAME:atw}
spring.datasource.password=${DB_PASSWORD:atw}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Flyway (schema migrations) ----
# Flyway owns the schema; Hibernate only validates it (ddl-auto=validate).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# We don't use Flyway placeholders; disable so SQL containing ${...} (e.g. seeded email
# templates with Thymeleaf expressions) is treated literally.
spring.flyway.placeholder-replacement=false

# ---- Redis (cache / data) ----
# Local: WSL2 Redis on localhost:6379, no password, no TLS.
# Azure Cache for Redis: set REDIS_HOST, REDIS_PORT=6380, REDIS_PASSWORD=<access key>, REDIS_SSL=true.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=2s

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# Exposes /actuator/health/liveness and /actuator/health/readiness for Azure probes.
management.endpoint.health.probes.enabled=true
# Mail provider outages are retried/logged via NotificationLog already; a transient SMTP issue
# (or an intentionally-unset host in the "log" dev provider) should not flip the app's health.
management.health.mail.enabled=false

# ---- Server ----
server.port=${SERVER_PORT:8080}

# ---- API documentation (springdoc / Swagger UI) ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---- JSON serialization ----
# Omit null fields (e.g. ApiResponse.error on success) from responses.
spring.jackson.default-property-inclusion=non_null

# ---- Thymeleaf ----
# We render email templates programmatically (from DB), not MVC view files, so there is no
# classpath:/templates/ directory — disable the startup location check.
spring.thymeleaf.check-template-location=false

# ---- CORS ----
# Comma-separated browser origins allowed to call the API. Override per environment.
atw.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---- File storage (Azure Blob; Azurite locally) ----
# Local default points at Azurite's well-known dev account (public emulator key, not a secret).
# In Azure: clear the connection string and set AZURE_STORAGE_ENDPOINT so managed identity is used.
atw.storage.azure.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;}
atw.storage.azure.endpoint=${AZURE_STORAGE_ENDPOINT:}
atw.storage.azure.container=${AZURE_STORAGE_CONTAINER:atw-documents}

# ---- Document policy ----
atw.documents.max-size-bytes=${DOC_MAX_SIZE_BYTES:10485760}
atw.documents.allowed-content-types=application/pdf,image/jpeg,image/png

# ---- Email ----
# provider=log (dev: writes emails to the log), smtp (a real mailbox), or azure (Azure Communication Services).
atw.mail.provider=${MAIL_PROVIDER:log}
atw.mail.from-address=${MAIL_FROM:hello@anytimework.in}
atw.mail.from-name=${MAIL_FROM_NAME:Anytime Work}
atw.mail.azure-connection-string=${AZURE_COMMUNICATION_CONNECTION_STRING:}
atw.mail.azure-endpoint=${AZURE_COMMUNICATION_ENDPOINT:}

# ---- SMTP transport (standard Spring Boot mail properties; read only when atw.mail.provider=smtp) ----
# Credentials come from environment variables only - never put a real password in this file (it's in git).
# Port 465 = implicit SSL (ssl.enable=true, starttls=false); port 587 = STARTTLS (ssl.enable=false, starttls=true).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---- Spring Modulith events (transactional outbox) ----
# Re-deliver any events whose listeners had not completed before a restart.
spring.modulith.events.republish-outstanding-events-on-restart=true

# ---- Security: JWT (HS256). Secret MUST be >= 32 bytes; use Key Vault in Azure. ----
# No insecure fallback here by design: outside the "local"/"test" profiles, StartupSecurityValidator
# refuses to start the app if this is blank, too short, or equal to the known local-dev literal.
atw.security.jwt.secret=${JWT_SECRET:}
atw.security.jwt.access-ttl=${JWT_ACCESS_TTL:PT15M}
atw.security.jwt.refresh-ttl=${JWT_REFRESH_TTL:P7D}
atw.security.jwt.issuer=${JWT_ISSUER:atw-backend}

# ---- Admin auth policy ----
atw.admin.security.otp-enabled=${ADMIN_OTP_ENABLED:true}
atw.admin.security.otp-ttl=${ADMIN_OTP_TTL:PT10M}
atw.admin.security.otp-length=${ADMIN_OTP_LENGTH:6}
atw.admin.security.otp-max-attempts=${ADMIN_OTP_MAX_ATTEMPTS:5}
atw.admin.security.otp-resend-interval=${ADMIN_OTP_RESEND_INTERVAL:PT60S}
atw.admin.security.otp-max-resends=${ADMIN_OTP_MAX_RESENDS:3}
atw.admin.security.max-failed-logins=${ADMIN_MAX_FAILED_LOGINS:5}
atw.admin.security.lockout-duration=${ADMIN_LOCKOUT_DURATION:PT15M}
atw.admin.security.password-reset-ttl=${ADMIN_PASSWORD_RESET_TTL:PT30M}

# ---- Bootstrap super-admin (created on first startup if no admins exist) ----
# Safe by default: off, with no default password. Enabled only in application-local.properties.
atw.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
atw.admin.bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:superadmin}
atw.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:superadmin@anytimework.in}
atw.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
atw.admin.bootstrap.full-name=${ADMIN_BOOTSTRAP_FULL_NAME:Platform Super Admin}

# ---- Document upload reconciliation (self-heals a blob/DB inconsistency after upload) ----
atw.documents.reconciliation-stale-after=${DOC_RECONCILE_STALE_AFTER:PT10M}
atw.documents.reconciliation-interval=${DOC_RECONCILE_INTERVAL:PT5M}

# ---- Frontend base URL (for invite / reset links in emails) ----
atw.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
