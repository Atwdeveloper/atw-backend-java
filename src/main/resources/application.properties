spring.application.name=atw-backend

# ---- Active profile ----
# "local" = this file's insecure dev conveniences (application-local.properties) are layered in.
# Any other value (e.g. "prod") keeps this file's safe-by-default settings and is enforced by
# StartupSecurityValidator (refuses to boot with a missing/default secret or bootstrap password).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ---- Datasource (PostgreSQL) ----
# Override via environment variables in each environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/atw}
spring.datasource.username=${DB_USERNAME:atw}
spring.datasource.password=${DB_PASSWORD:atw}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Flyway (schema migrations) ----
# Flyway owns the schema; Hibernate only validates it (ddl-auto=validate).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# We don't use Flyway placeholders; disable so SQL containing ${...} (e.g. seeded email
# templates with Thymeleaf expressions) is treated literally.
spring.flyway.placeholder-replacement=false

# ---- Redis (cache / data) ----
# Local: WSL2 Redis on localhost:6379, no password, no TLS.
# Azure Cache for Redis: set REDIS_HOST, REDIS_PORT=6380, REDIS_PASSWORD=<access key>, REDIS_SSL=true.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=2s

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# Exposes /actuator/health/liveness and /actuator/health/readiness for Azure probes.
management.endpoint.health.probes.enabled=true
# Mail provider outages are retried/logged via NotificationLog already; a transient SMTP issue
# (or an intentionally-unset host in the "log" dev provider) should not flip the app's health.
management.health.mail.enabled=false

# ---- Server ----
server.port=${SERVER_PORT:8080}

# ---- Pagination defaults (every listing endpoint) ----
# 100 is generous enough that today's small masterdata lists (departments, industries, ...) still come
# back in one page unchanged for a client that never passes page/size - this is what makes newly
# paginating those endpoints a non-breaking change. max-page-size is a hard ceiling against an
# unbounded ?size= request becoming a resource-exhaustion vector.
spring.data.web.pageable.default-page-size=100
spring.data.web.pageable.max-page-size=500

# ---- API documentation (springdoc / Swagger UI) ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---- JSON serialization ----
# Omit null fields (e.g. ApiResponse.error on success) from responses.
spring.jackson.default-property-inclusion=non_null

# ---- Thymeleaf ----
# We render email templates programmatically (from DB), not MVC view files, so there is no
# classpath:/templates/ directory — disable the startup location check.
spring.thymeleaf.check-template-location=false

# ---- CORS ----
# Comma-separated browser origins allowed to call the API. Override per environment.
atw.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---- File storage (Azure Blob; Azurite locally) ----
# Local default points at Azurite's well-known dev account (public emulator key, not a secret).
# In Azure: clear the connection string and set AZURE_STORAGE_ENDPOINT so managed identity is used.
atw.storage.azure.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;}
atw.storage.azure.endpoint=${AZURE_STORAGE_ENDPOINT:}
atw.storage.azure.container=${AZURE_STORAGE_CONTAINER:atw-documents}

# ---- Document policy ----
atw.documents.max-size-bytes=${DOC_MAX_SIZE_BYTES:10485760}
atw.documents.allowed-content-types=application/pdf,image/jpeg,image/png,image/webp

# ---- Multipart upload (must stay >= the largest allowed upload any module validates for -
# currently masterdata's 2MB icon cap; Spring Boot's own default is 1MB, below that cap) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---- Email ----
# provider=log (dev: writes emails to the log), smtp (a real mailbox), or azure (Azure Communication Services).
atw.mail.provider=${MAIL_PROVIDER:log}
atw.mail.from-address=${MAIL_FROM:hello@anytimework.in}
atw.mail.from-name=${MAIL_FROM_NAME:Anytime Work}
atw.mail.azure-connection-string=${AZURE_COMMUNICATION_CONNECTION_STRING:}
atw.mail.azure-endpoint=${AZURE_COMMUNICATION_ENDPOINT:}

# ---- SMTP transport (standard Spring Boot mail properties; read only when atw.mail.provider=smtp) ----
# Credentials come from environment variables only - never put a real password in this file (it's in git).
# Port 465 = implicit SSL (ssl.enable=true, starttls=false); port 587 = STARTTLS (ssl.enable=false, starttls=true).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---- Spring Modulith events (transactional outbox) ----
# Re-deliver any events whose listeners had not completed before a restart.
spring.modulith.events.republish-outstanding-events-on-restart=true

# ---- Security: JWT (HS256). Secret MUST be >= 32 bytes; use Key Vault in Azure. ----
# No insecure fallback here by design: outside the "local"/"test" profiles, StartupSecurityValidator
# refuses to start the app if this is blank, too short, or equal to the known local-dev literal.
atw.security.jwt.secret=${JWT_SECRET:}
atw.security.jwt.access-ttl=${JWT_ACCESS_TTL:PT15M}
atw.security.jwt.refresh-ttl=${JWT_REFRESH_TTL:P7D}
atw.security.jwt.issuer=${JWT_ISSUER:atw-backend}

# ---- Security: PII encryption (AES-256-GCM) for staff KYC/bank data at rest ----
# Base64, must decode to exactly 32 bytes. Same no-insecure-fallback rule as the JWT secret above;
# in Azure this env var is backed by a Key Vault secret reference (app code never changes).
atw.security.pii-encryption.key=${PII_ENCRYPTION_KEY:}

# ---- Security: worker PII encryption (AES-256-GCM), separate key from the one above ----
# Deliberately a different key from PII_ENCRYPTION_KEY: worker records will vastly outscale staff
# records in both row count and external exposure, so a compromise of one key does not also expose
# the other dataset. Same base64/32-byte/no-insecure-fallback rules.
atw.security.worker-pii-encryption.key=${WORKER_PII_ENCRYPTION_KEY:}

# ---- Admin auth policy ----
atw.admin.security.otp-enabled=${ADMIN_OTP_ENABLED:true}
atw.admin.security.otp-ttl=${ADMIN_OTP_TTL:PT10M}
atw.admin.security.otp-length=${ADMIN_OTP_LENGTH:6}
atw.admin.security.otp-max-attempts=${ADMIN_OTP_MAX_ATTEMPTS:5}
atw.admin.security.otp-resend-interval=${ADMIN_OTP_RESEND_INTERVAL:PT60S}
atw.admin.security.otp-max-resends=${ADMIN_OTP_MAX_RESENDS:3}
# Inert: account-level lockout was removed (AuthRateLimitFilter's per-IP cap + mandatory OTP are
# the brute-force defense now). These two are no longer read; kept only so this var name doesn't
# start erroring if still set somewhere.
atw.admin.security.max-failed-logins=${ADMIN_MAX_FAILED_LOGINS:5}
atw.admin.security.lockout-duration=${ADMIN_LOCKOUT_DURATION:PT15M}
atw.admin.security.password-reset-ttl=${ADMIN_PASSWORD_RESET_TTL:PT30M}
atw.admin.security.invite-ttl=${ADMIN_INVITE_TTL:P3D}
# Test-only shortcut: when true, the login/resend-otp responses include the OTP code directly
# instead of only emailing it - lets local dev work without a real SMTP provider configured.
# StartupSecurityValidator refuses to start the app with this on outside local/test.
atw.admin.security.otp-in-response=${ADMIN_OTP_IN_RESPONSE:true}
# Deployed-environment-only escape hatch for pre-SMTP testing: when set, every issued OTP (login AND
# resend) is this fixed value instead of a random code, so you can log in without reading logs/email.
# Must be exactly atw.admin.security.otp-length numeric digits. StartupSecurityValidator refuses to
# boot if this is set under any profile other than "dev" - see application-dev.properties.
atw.admin.security.fixed-otp=${ADMIN_FIXED_OTP:}

# ---- Rate limiting (Redis-backed) for public, abuse-prone admin auth endpoints ----
atw.admin.security.rate-limit.enabled=${ADMIN_RATE_LIMIT_ENABLED:true}
atw.admin.security.rate-limit.max-attempts=${ADMIN_RATE_LIMIT_MAX_ATTEMPTS:10}
atw.admin.security.rate-limit.window=${ADMIN_RATE_LIMIT_WINDOW:PT1M}

# ---- Bootstrap super-admin (created on first startup if no admins exist) ----
# Safe by default: off, with no default password. Enabled only in application-local.properties.
atw.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
atw.admin.bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:superadmin}
atw.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:superadmin@anytimework.in}
atw.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
atw.admin.bootstrap.full-name=${ADMIN_BOOTSTRAP_FULL_NAME:Platform Super Admin}

# ---- Document upload reconciliation (self-heals a blob/DB inconsistency after upload) ----
atw.documents.reconciliation-stale-after=${DOC_RECONCILE_STALE_AFTER:PT10M}
atw.documents.reconciliation-interval=${DOC_RECONCILE_INTERVAL:PT5M}

# ---- Frontend base URL (for invite / reset links in emails) ----
atw.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# ---- Face-auth (external Python service; the stub adapter is the local/test default and needs none
# of this - these are only read once atw.face-auth.provider=python is set for a real deployment) ----
atw.face-auth.base-url=${FACE_AUTH_BASE_URL:}
atw.face-auth.api-key=${FACE_AUTH_API_KEY:}
atw.face-auth.timeout=${FACE_AUTH_TIMEOUT:PT75S}

# ---- SMS (Exotel; the log adapter is the local/test default and needs none of this - these are only
# read once atw.sms.provider=exotel is set for a real deployment). Credentials carried over from the
# legacy app's own Exotel account - set the real values as environment variables, never in this file. ----
atw.sms.exotel.api-key=${EXOTEL_API_KEY:}
atw.sms.exotel.api-token=${EXOTEL_API_TOKEN:}
atw.sms.exotel.sid=${EXOTEL_SID:}
atw.sms.exotel.subdomain=${EXOTEL_SUBDOMAIN:api.exotel.com}
atw.sms.exotel.sender-id=${EXOTEL_SENDER_ID:}
atw.sms.exotel.dlt-template-id=${EXOTEL_DLT_TEMPLATE_ID:}
atw.sms.exotel.timeout=${EXOTEL_TIMEOUT:PT15S}

# ---- Aadhaar e-KYC (Sandbox.co.in; the stub adapter is the local/test default and needs none of this
# - these are only read once atw.aadhaar-kyc.provider=sandbox is set for a real deployment). Credentials
# carried over from the legacy app's own Sandbox.co.in account - set the real values as environment
# variables, never in this file. ----
atw.aadhaar-kyc.sandbox.base-url=${SANDBOX_KYC_BASE_URL:https://api.sandbox.co.in}
atw.aadhaar-kyc.sandbox.api-key=${SANDBOX_API_KEY:}
atw.aadhaar-kyc.sandbox.api-secret=${SANDBOX_API_SECRET:}
atw.aadhaar-kyc.sandbox.timeout=${SANDBOX_KYC_TIMEOUT:PT20S}
