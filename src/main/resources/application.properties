spring.application.name=atw-backend

# ---- Datasource (PostgreSQL) ----
# Override via environment variables in each environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/atw}
spring.datasource.username=${DB_USERNAME:atw}
spring.datasource.password=${DB_PASSWORD:atw}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Flyway (schema migrations) ----
# Flyway owns the schema; Hibernate only validates it (ddl-auto=validate).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- Redis (cache / data) ----
# Local: WSL2 Redis on localhost:6379, no password, no TLS.
# Azure Cache for Redis: set REDIS_HOST, REDIS_PORT=6380, REDIS_PASSWORD=<access key>, REDIS_SSL=true.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=2s

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# Exposes /actuator/health/liveness and /actuator/health/readiness for Azure probes.
management.endpoint.health.probes.enabled=true

# ---- Server ----
server.port=${SERVER_PORT:8080}
