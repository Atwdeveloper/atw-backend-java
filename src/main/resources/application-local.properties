# Local-developer-only convenience defaults. Loaded only when the "local" profile is active
# (the default — see spring.profiles.active in application.properties). Never used outside a
# developer's own machine: StartupSecurityValidator enforces strong, explicit values everywhere else.

# Known, publicly-committed values are fine here precisely because this file only ever applies locally.
atw.security.jwt.secret=dev-only-insecure-change-me-atw-backend-hs256-secret-key-0123456789
atw.security.pii-encryption.key=aMgtn19OYBxgsWujXQpe/YjMiaigx0E7r0DXa3kKrRQ=
atw.security.worker-pii-encryption.key=c8ZWWQX6uaMDrKhuKJU8cwyz80sraP4EdBWcKfHZ4WM=
atw.security.company-pii-encryption.key=Kwb3C/mwniu9+FHglHDYdXObxrzBILTeSIncV96oCsQ=

atw.admin.bootstrap.enabled=true
atw.admin.bootstrap.password=ChangeMe@12345

# Azurite's well-known dev account (public emulator key, not a secret) - moved here from
# application.properties on 2026-11-24 so it can never leak into a real deployment's default.
atw.storage.azure.connection-string=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;

# No SMTP configured locally by default (atw.mail.provider=log) - this puts the OTP straight into
# the login/resend-otp API response too, so the admin frontend/Postman can be exercised end-to-end
# without reading the server log. StartupSecurityValidator refuses to boot with this on outside
# local/test, so it can never leak into a real deployment.
atw.admin.security.otp-in-response=true
# Same reasoning as the admin line above, for the company-user login flow (part 2/3 of the company module).
atw.company.security.otp-in-response=true

# File logging is a local-dev convenience only: in a container the filesystem is ephemeral (lost on
# every restart anyway) and the app runs as a non-root user with no write access to its own working
# directory, so this would fail at startup outside "local" - it already did, in testing.
logging.file.name=logs/atw-backend.log

# Real face-auth service, not the random-embedding stub - points at the live deployment (Render) of
# the sibling atw-face-auth-service repo (same codebase as D:\Office_project\face_auth_model\face-auth,
# just hosted, not run locally). The base URL alone isn't sensitive, safe to commit here - but
# atw.face-auth.api-key is a real credential and must NEVER be hardcoded in any committed file: set it
# as an actual FACE_AUTH_API_KEY environment variable (shell, IDE run config, or similar) before
# running the app. Without a valid key, every call fails loudly with a clear "rejected the request:
# invalid_api_key" error - never silently falls back to the stub. Comment both lines out (or override
# atw.face-auth.provider=stub) to go back to the always-random stub; see compose.yaml's `face-auth`
# profile for a fully-local (offline, no Render dependency) alternative instead of this one.
atw.face-auth.provider=python
atw.face-auth.base-url=https://face-auth-service-m2o7.onrender.com
