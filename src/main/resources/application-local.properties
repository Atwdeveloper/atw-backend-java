# Local-developer-only convenience defaults. Loaded only when the "local" profile is active
# (the default — see spring.profiles.active in application.properties). Never used outside a
# developer's own machine: StartupSecurityValidator enforces strong, explicit values everywhere else.

# Known, publicly-committed values are fine here precisely because this file only ever applies locally.
atw.security.jwt.secret=dev-only-insecure-change-me-atw-backend-hs256-secret-key-0123456789

atw.admin.bootstrap.enabled=true
atw.admin.bootstrap.password=ChangeMe@12345

# File logging is a local-dev convenience only: in a container the filesystem is ephemeral (lost on
# every restart anyway) and the app runs as a non-root user with no write access to its own working
# directory, so this would fail at startup outside "local" - it already did, in testing.
logging.file.name=logs/atw-backend.log
