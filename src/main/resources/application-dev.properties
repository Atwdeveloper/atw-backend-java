# Azure "dev" environment profile. Unlike "local", this does NOT relax any of the real secret
# requirements StartupSecurityValidator enforces - JWT secret, bootstrap password, PII encryption
# key, and otp-in-response must all still be real, unique, non-default values here, exactly like
# any other deployment.
#
# The ONLY thing this profile unlocks: if ADMIN_FIXED_OTP is ALSO explicitly set, admin login/
# resend-otp issues that fixed value instead of a random code, so admins can log in without a
# working SMTP/email provider configured yet. Setting this profile alone does nothing - both the
# profile AND the env var must be set together. StartupSecurityValidator refuses to boot if
# ADMIN_FIXED_OTP is set under any profile other than "dev", so this can never silently end up
# active on a production deployment.
#
# This is a deliberate, narrow, TEMPORARY allowance for pre-SMTP testing on a real Azure
# deployment - treat it with the same care as any other security control. Unset ADMIN_FIXED_OTP
# the moment real OTP delivery (email) is available on this environment. Do not add other relaxed
# settings to this file; a new shortcut here needs the same explicit review as a change to
# StartupSecurityValidator itself.
