# Local backing services for development.
# Postgres and Redis run natively on this machine, so only the cloud-emulated services are here.
# Start with:  docker compose up -d
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: "azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck"
    ports:
      - "10000:10000"   # Blob service
    volumes:
      - azurite-data:/data

volumes:
  azurite-data:
